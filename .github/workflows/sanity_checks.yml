name: Sanity Checks

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every combination that ships: the backend on, and off.
        features:
          - ""
          - "--no-default-features"

    name: ${{ matrix.features || 'default features' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -Dwarnings

      - name: Run tests
        run: cargo test ${{ matrix.features }}
