name: Publish amd64 image to GHCR

# The upstream workflow builds arm64 only, on an arm runner. This publishes an
# amd64 image for clusters that need one. Kept on its own branch so it never
# lands in the upstream PR.
on:
  workflow_dispatch:
  push:
    branches: [ci/ghcr-amd64]

env:
  IMAGE: ghcr.io/getlucho/rati

jobs:
  # Does the stock Dockerfile still build now that the Azure SDK is in the graph?
  # rustls pulls aws-lc-sys, which wants cmake and a C compiler, and the apk line
  # that would supply them is commented out. Allowed to fail: the answer decides
  # whether the upstream PR needs a Dockerfile change.
  stock-dockerfile-probe:
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      result: ${{ steps.probe.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: probe
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=stock
          cache-to: type=gha,mode=max,scope=stock

  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build deps for aws-lc-sys on musl. Upstream ships this line commented out.
      - name: Enable the build toolchain in the builder stage
        run: |
          sed -i 's|^# RUN apk add --no-cache alpine-sdk cmake|RUN apk add --no-cache alpine-sdk cmake|' Dockerfile
          grep -n 'apk add' Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Show what was published
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:latest
